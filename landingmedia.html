<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬립코어 반응형</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/commons.css">
    <link rel="stylesheet" href="assets/css/landingmedia.css">
</head>
<body>
    
<body>
    <header class="header-wrap">
        <nav class="nav">
            <div class="logo">
                <img src="assets/images/icon/logo_night.svg" alt="">
                <h3 class="logo-tit">슬립코어</h3>
            </div>
            <div class="gnb">
                <ul class="navi font-color-s">
                    <li>
                        <a href="#">슬립코어 둘러보기</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <section class="kv-section section-pd">
        <div class="container">
            <div class="kv-main">
                <!-- 텍스트 영역 (왼쪽) -->
                <div class="kv-title">
                    <h3 class="third-title font-color-m">잠 못 드는 이유, 있다</h3>
                    <h1 class="main-title font-color-s">수면검사</h1>
                    <h2 class="sub-title font-color-m">숨은 원인을 찾습니다</h2>
                    <p class="desc font-color-a ac-title">
                        불면증, 코골이, 만성피로<br>
                        혼자 고민하지 말고 수면 전문가에게 맡기세요!
                    </p>
                    <a href="#" class="cta">
                        온라인 진료 무료
                        <img src="assets/images/icon/arrow.svg" alt="">
                    </a>
                </div>
                <!-- 비주얼 영역 (오른쪽) -->
                <div class="class-visual">
                    <img src="assets/images/doctor.png" class="main-img" alt="">
                    <div class="info-card-1">
                        <div class="card-top">
                            <img src="assets/images/icon/icon1.png" alt="">
                            <div class="card-title">
                                이젠란스 병원
                            </div>
                        </div>
                        <div class="card-bottom">정신건강의학과 출신 전문의 진단
                        </div>
                    </div>
                    <div class="info-card-2">
                        <div class="card-top">
                            <img src="assets/images/icon/icon2.png" alt="">
                            <div class="card-title">
                                보건복지부
                            </div>
                        </div>
                        <div class="card-bottom">건강보험 적용, 의료기관 인증 기관
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
